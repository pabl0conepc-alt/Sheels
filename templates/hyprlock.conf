# Sheels lock screen — hyprlock recreation of Caelestia's lock (modules/lock).
# Generated from templates/hyprlock.conf by `sheels` on every theme change.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    fingerprint:enabled = true
}

animations {
    enabled = true
    bezier = expr, 0.38, 1.21, 0.22, 1
    animation = fadeIn, 1, 4, expr
    animation = fadeOut, 1, 3, default
    animation = inputFieldDots, 1, 2, default
}

background {
    monitor =
    path = {{ wallpaper }}
    blur_passes = 3
    blur_size = 8
    brightness = 0.35
    color = rgb(000000)
}

# ---------------------------------------------------------------- container
shape {
    monitor =
    size = 1344, 756
    color = rgba({{ surface.hex }}f2)
    rounding = 56
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

