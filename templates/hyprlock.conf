    color = rgb({{ onSurfaceVariant.hex }})
    font_size = 90
    position = 0, -77
    halign = center
    valign = center
    zindex = 3
}
image {
    monitor =
    path = {{ face }}
    size = 200
    rounding = -1
    border_size = 0
    position = 0, -77
    halign = center
    valign = center
    zindex = 3
}
input-field {
    monitor =
    size = 282, 44
    outline_thickness = 0
    inner_color = rgb({{ surfaceContainer.hex }})
    font_color = rgb({{ onSurface.hex }})
    check_color = rgb({{ secondary.hex }})
    fail_color = rgb({{ error.hex }})
    capslock_color = rgb({{ tertiary.hex }})
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##{{ outline.hex }}"><span font_desc="Material Symbols Rounded">lock</span>    Enter your password</span>
    fail_text = <span foreground="##{{ error.hex }}">$FAIL ($ATTEMPTS)</span>
    font_family = Google Sans Flex
    position = 0, -247
    halign = center
    valign = center
    zindex = 3
}

