# ---------------------------------------------------------------- centre
label { # clock: condensed Google Sans Flex, hours primary / minutes secondary
    monitor =
    text = cmd[update:1000] echo "<span foreground='##{{ primary.hex }}'>$(date +%H)</span><span foreground='##{{ secondary.hex }}'>$(date +%M)</span>"
    font_family = Google Sans Flex @wdth=25,wght=500
    font_size = 132
    position = 0, 215
    halign = center
    valign = center
    zindex = 3
}
label {
    monitor =
    text = cmd[update:60000] date +"%A • %-d %b" | tr '[:lower:]' '[:upper:]'
    color = rgb({{ onSurface.hex }})
    font_size = 16
    font_family = Google Sans Flex Semi-Bold
    position = 0, 99
    halign = center
    valign = center
    zindex = 3
}
shape { # avatar backdrop (Caelestia draws a hexagon-ish cookie)
    monitor =
    size = 312, 212
    color = rgb({{ surfaceContainerHigh.hex }})
    rounding = 90
    position = 0, -77
