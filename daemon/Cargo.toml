[package]
name = "sheels"
version = "1.0.0"
description = "Caelestia-style desktop shell backend for driftwm + EWW"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2.191"
material-colors = { version = "0.5.0", features = ["quantize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "macros", "process", "sync", "fs", "signal"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy", "service"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
